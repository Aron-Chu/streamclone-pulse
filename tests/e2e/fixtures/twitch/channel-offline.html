<!DOCTYPE html>
<html lang="en" class="tw-root--theme-dark">
<head>
  <meta charset="utf-8" />
  <title>fixturechan - Twitch</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e0e10; color: #efeff1; font-family: Inter, Arial, sans-serif; }
    #layout { display: flex; height: 100vh; }
    #player { flex: 1; position: relative; background: #18181b; }
    .channel-root__right-column {
      width: 340px;
      min-width: 340px;
      height: 100vh;
      background: #1f1f23;
      display: flex;
      flex-direction: column;
    }
    [data-test-selector="chat-room-component-layout"] {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 400px;
      min-width: 300px;
    }
    [data-a-target="chat-room-header"] { padding: 12px; border-bottom: 1px solid #2f2f35; }
    [data-test-selector="chat-scrollable-area"] { flex: 1; overflow: auto; padding: 8px; min-height: 200px; }
    [data-a-target="chat-input"] { margin: 8px; min-height: 40px; }
    [data-a-target="channel-offline-header"] { padding: 24px; font-size: 24px; font-weight: 700; }
  </style>
</head>
<body>
  <div id="layout">
    <div id="player">
      <img data-a-target="channel-offline-still-image" alt="Offline" width="640" height="360" />
      <h1 data-a-target="channel-offline-header">fixturechan is offline</h1>
    </div>
    <aside class="channel-root__right-column" aria-label="Chat">
      <section data-test-selector="chat-room-component-layout">
        <header data-a-target="chat-room-header"><h2>Stream Chat</h2></header>
        <div data-test-selector="chat-scrollable-area" data-a-target="chat-scrollable-area">
          <div>Offline fixture chat</div>
        </div>
        <div data-a-target="chat-input"><textarea placeholder="Send a message"></textarea></div>
      </section>
    </aside>
  </div>
</body>
</html>

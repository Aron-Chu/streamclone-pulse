name: Bug report
description: Report a reproducible Streamclone Pulse / portal issue
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Do **not** paste `.env`, tokens, DSNs, exploit details, raw chat, or production topology.
        Privacy/legal: `privacy@streampulse.stream`. Security: see SECURITY.md (no public exploit reports).
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Chrome extension (Twitch overlay)
        - Extension Options / popup
        - StreamPulse portal (streampulse-web)
        - Packaging / CI / docs
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension or portal version / commit
      placeholder: e.g. package version, build provenance, or short SHA
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Load unpacked extension...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact secrets and channel-identifying data before posting.

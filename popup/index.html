<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <title>StreamPulse</title>
    <style>
      /* Paint the page colour before the script loads so the popup never flashes. */
      html,
      body {
        background: #111117;
        margin: 0;
        padding: 0;
      }
      @media (prefers-color-scheme: light) {
        html,
        body {
          background: #f1f1f4;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>

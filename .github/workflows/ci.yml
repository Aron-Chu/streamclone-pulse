name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  context-contract:
    name: Owner-local context + public topology
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Owner-local context contract
        run: bash scripts/ci-context-contract.sh
      - name: Public topology scan
        run: bash scripts/ci-public-topology-scan.sh

  extension-unit:
    name: extension-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pulse packages
        env:
          STREAMPULSE_BACKEND_CHECKOUT_TOKEN: ${{ secrets.STREAMPULSE_BACKEND_CHECKOUT_TOKEN }}
        run: bash scripts/ci-checkout-pulse-packages.sh
      - name: Link pulse packages from streampulse-backend
        run: bash scripts/ci-link-streamclone-packages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Check packaging scripts
        run: |
          node --check scripts/zip-dist.mjs
          node --check scripts/validate-extension-package.mjs
          node --check scripts/extension-package-lib.mjs
      - name: Build CWS zip and validate package
        run: |
          npm run zip
          npm run validate:package
          test -f streampulse-extension.zip
          test -f streampulse-extension.zip.sha256
          echo "ZIP_SHA256=$(cut -d' ' -f1 streampulse-extension.zip.sha256)"
          # Avoid SIGPIPE under pipefail: list a bounded prefix without piping to head.
          mapfile -t ZIP_ENTRIES < <(unzip -Z1 streampulse-extension.zip)
          echo "ZIP_ENTRY_COUNT=${#ZIP_ENTRIES[@]}"
          printf '%s\n' "${ZIP_ENTRIES[@]:0:40}"
      - name: Upload extension dist
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: dist/
          retention-days: 3
      - name: Upload CWS zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: streampulse-extension-zip
          path: |
            streampulse-extension.zip
            streampulse-extension.zip.sha256
          retention-days: 14

  extension-e2e:
    name: extension-e2e
    runs-on: ubuntu-latest
    needs: extension-unit
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pulse packages
        env:
          STREAMPULSE_BACKEND_CHECKOUT_TOKEN: ${{ secrets.STREAMPULSE_BACKEND_CHECKOUT_TOKEN }}
        run: bash scripts/ci-checkout-pulse-packages.sh
      - name: Link pulse packages from streampulse-backend
        run: bash scripts/ci-link-streamclone-packages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Record toolchain versions
        run: |
          {
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "playwright: $(npx playwright --version)"
            chromium --version 2>/dev/null || google-chrome --version 2>/dev/null || true
          } | tee extension-e2e-versions.txt
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Download extension dist
        uses: actions/download-artifact@v4
        with:
          name: extension-dist
          path: dist
      - name: Run mocked extension e2e
        # Headed Chromium under xvfb — MV3 unpacked extensions are unreliable in headless.
        run: xvfb-run --auto-servernum --server-args='-screen 0 1440x900x24' npm run test:e2e:mocked
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extension-e2e-evidence
          path: |
            test-results/extension/
            playwright-report/extension/
            extension-e2e-versions.txt
          retention-days: 14

  portal:
    name: portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streampulse-web
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pulse packages
        working-directory: ${{ github.workspace }}
        env:
          STREAMPULSE_BACKEND_CHECKOUT_TOKEN: ${{ secrets.STREAMPULSE_BACKEND_CHECKOUT_TOKEN }}
        run: bash scripts/ci-checkout-pulse-packages.sh
      - name: Link StreamPulse packages
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-link-streamclone-packages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: streampulse-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --pool=forks --maxWorkers=2 --no-file-parallelism
      - run: npm run check:analytics-overlap
      # build:ci = Ubuntu-safe vite + prerender (same production artifact path as origin/master).
      - run: npm run build:ci

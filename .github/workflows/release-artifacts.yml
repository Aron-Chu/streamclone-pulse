# Owner-dispatched attested store packages for an existing protected v* tag.
# Does NOT upload to browser stores, publish npm, or mutate release assets without
# a separate owner-approved step. The dispatch itself must target the tagged commit.
#
# Action pins: full commit SHA with release tag in comments.
name: Release artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing protected v* tag (e.g. v0.1.2)'
        required: true
        type: string
      expected_sha:
        description: 'Exact protected master commit the tag must resolve to (full SHA)'
        required: true
        type: string
      ci_run_id:
        description: 'Completed workflow-dispatch CI run for the exact SHA (force_full=true)'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-artifacts-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: package-and-attest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      cws_digest: ${{ steps.digests.outputs.cws_digest }}
      edge_digest: ${{ steps.digests.outputs.edge_digest }}
      firefox_digest: ${{ steps.digests.outputs.firefox_digest }}
      version: ${{ steps.digests.outputs.version }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      # actions/checkout@v4 — full history so tag→commit verification is local
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact tag dispatch context
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/tags/${INPUT_TAG}"
          expected_sha="$(printf '%s' "${EXPECTED_SHA}" | tr '[:upper:]' '[:lower:]')"
          dispatch_sha="$(printf '%s' "${DISPATCH_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${DISPATCH_REF}" != "${expected_ref}" ]]; then
            echo "::error::Release artifacts must be dispatched from ${expected_ref}; event ref was ${DISPATCH_REF}"
            exit 1
          fi
          if [[ ! "${expected_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-char commit SHA"
            exit 1
          fi
          if [[ "${dispatch_sha}" != "${expected_sha}" ]]; then
            echo "::error::event SHA ${DISPATCH_SHA} does not match expected source SHA ${EXPECTED_SHA}"
            exit 1
          fi
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "${checkout_sha}" != "${DISPATCH_SHA}" ]]; then
            echo "::error::checkout HEAD ${checkout_sha} does not match event SHA ${DISPATCH_SHA}"
            exit 1
          fi
          echo "Verified dispatch ref ${DISPATCH_REF} and source SHA ${DISPATCH_SHA}"

      - name: Verify protected tag resolves to expected SHA
        id: verify
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match v<major>.<minor>.<patch> (got ${tag})"
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} does not exist on this repository"
            exit 1
          fi
          resolved="$(git rev-list -n 1 "refs/tags/${tag}")"
          expected="$(echo "${EXPECTED_SHA}" | tr '[:upper:]' '[:lower:]')"
          resolved_lc="$(echo "${resolved}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${expected}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full 40-char commit SHA"
            exit 1
          fi
          if [[ "${resolved_lc}" != "${expected}" ]]; then
            echo "::error::tag ${tag} resolves to ${resolved}, expected ${EXPECTED_SHA}"
            exit 1
          fi
          if [[ "${DISPATCH_REF}" != "refs/tags/${tag}" ]]; then
            echo "::error::release workflow must be dispatched from ${tag}, got ${DISPATCH_REF}"
            exit 1
          fi
          dispatch_sha="$(echo "${DISPATCH_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${dispatch_sha}" != "${resolved_lc}" ]]; then
            echo "::error::workflow dispatch SHA ${DISPATCH_SHA} does not match tag commit ${resolved}"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${resolved}" ]]; then
            echo "::error::checked-out HEAD is not the exact tag commit ${resolved}"
            exit 1
          fi
          # Confirm the commit is on master (protected default)
          if ! git merge-base --is-ancestor "${resolved}" origin/master && \
             ! git merge-base --is-ancestor "${resolved}" origin/main; then
            echo "::error::${resolved} is not an ancestor of origin/master|main"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${resolved}" >> "$GITHUB_OUTPUT"
          echo "Verified ${tag} → ${resolved}"

      - name: Verify package versions and exact-SHA full CI
        env:
          TAG: ${{ steps.verify.outputs.tag }}
          EXPECTED_SHA: ${{ steps.verify.outputs.source_sha }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${CI_RUN_ID}" =~ ^[0-9]+$ ]] || { echo "::error::ci_run_id must be numeric"; exit 1; }
          VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${VERSION}"
          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "::error::tag ${TAG} must equal package version tag ${EXPECTED_TAG}"
            exit 1
          fi
          node <<'NODE'
          const fs = require('node:fs')
          const packageVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version
          const files = ['manifest.json', 'manifests/development.json', 'manifests/cws.json', 'manifests/edge.json', 'manifests/firefox.json']
          for (const file of files) {
            const version = JSON.parse(fs.readFileSync(file, 'utf8')).version
            if (version !== packageVersion) {
              throw new Error(`${file} version ${version} does not match package.json ${packageVersion}`)
            }
          }
          NODE

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"
          run_head="$(jq -r '.head_sha // empty' <<<"${run_json}")"
          run_name="$(jq -r '.name // empty' <<<"${run_json}")"
          run_path="$(jq -r '.path // empty' <<<"${run_json}")"
          run_event="$(jq -r '.event // empty' <<<"${run_json}")"
          run_status="$(jq -r '.status // empty' <<<"${run_json}")"
          run_conclusion="$(jq -r '.conclusion // empty' <<<"${run_json}")"
          [[ "${run_head}" == "${EXPECTED_SHA}" ]] || { echo "::error::CI run head ${run_head} does not match ${EXPECTED_SHA}"; exit 1; }
          [[ "${run_name}" == "CI" ]] || { echo "::error::CI run is not the CI workflow (${run_name})"; exit 1; }
          [[ "${run_path}" == ".github/workflows/ci.yml" ]] || { echo "::error::CI run path is ${run_path}"; exit 1; }
          [[ "${run_event}" == "workflow_dispatch" ]] || { echo "::error::CI run must be workflow_dispatch with force_full=true"; exit 1; }
          [[ "${run_status}" == "completed" && "${run_conclusion}" == "success" ]] || { echo "::error::CI run is not completed successfully"; exit 1; }

          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs?per_page=100")"
          extension_count="$(jq '[.jobs[] | select(.name == "extension")] | length' <<<"${jobs_json}")"
          [[ "${extension_count}" == "1" ]] || { echo "::error::exact-SHA CI did not execute one extension job"; exit 1; }
          extension_conclusion="$(jq -r '[.jobs[] | select(.name == "extension") | .conclusion][0] // empty' <<<"${jobs_json}")"
          [[ "${extension_conclusion}" == "success" ]] || { echo "::error::extension job conclusion=${extension_conclusion}"; exit 1; }
          for required_step in "Force-full dispatch proof" "Mocked extension E2E" "Firefox packaged-extension runtime smoke"; do
            step_conclusion="$(jq -r --arg step "${required_step}" '[.jobs[] | select(.name == "extension") | .steps[] | select(.name == $step) | .conclusion][0] // empty' <<<"${jobs_json}")"
            [[ "${step_conclusion}" == "success" ]] || { echo "::error::required extension step ${required_step} conclusion=${step_conclusion}"; exit 1; }
          done
          echo "Verified package version ${VERSION} and full CI run ${CI_RUN_ID} for ${EXPECTED_SHA}"

      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm

      - name: Install and build store packages
        run: |
          set -euo pipefail
          npm ci
          npm run ensure:packages
          npm run package:cws
          npm run package:edge
          npm run package:firefox

      - name: Collect digests and verification report
        id: digests
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          TAG: ${{ steps.verify.outputs.tag }}
          RUN_ID: ${{ github.run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          CWS_ZIP="streampulse-extension-cws-${VERSION}.zip"
          EDGE_ZIP="streampulse-extension-edge-${VERSION}.zip"
          FIREFOX_ZIP="streampulse-extension-firefox-${VERSION}.zip"
          test -f "$CWS_ZIP"
          test -f "$EDGE_ZIP"
          test -f "$FIREFOX_ZIP"
          test -f "${CWS_ZIP}.sha256"
          test -f "${EDGE_ZIP}.sha256"
          test -f "${FIREFOX_ZIP}.sha256"
          test -f "streampulse-extension-cws-${VERSION}.validation.json"
          test -f "streampulse-extension-edge-${VERSION}.validation.json"
          test -f "streampulse-extension-firefox-${VERSION}.validation.json"
          CWS_DIGEST="$(cut -d' ' -f1 "${CWS_ZIP}.sha256")"
          EDGE_DIGEST="$(cut -d' ' -f1 "${EDGE_ZIP}.sha256")"
          FIREFOX_DIGEST="$(cut -d' ' -f1 "${FIREFOX_ZIP}.sha256")"
          MANIFEST_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('dist/manifest.json','utf8')).version")"
          mkdir -p release-verification
          VERSION="$VERSION" \
          CWS_DIGEST="$CWS_DIGEST" \
          EDGE_DIGEST="$EDGE_DIGEST" \
          FIREFOX_DIGEST="$FIREFOX_DIGEST" \
          MANIFEST_VERSION="$MANIFEST_VERSION" \
          SOURCE_SHA="$SOURCE_SHA" \
          TAG="$TAG" \
          RUN_ID="$RUN_ID" \
          node -e '
             const fs = require("fs");
             const report = {
               schema: "streampulse.release-artifact-verification/v1",
               tag: process.env.TAG,
               sourceRef: `refs/tags/${process.env.TAG}`,
               sourceSha: process.env.SOURCE_SHA,
               workflowRunId: process.env.RUN_ID,
               validatedCiRunId: process.env.CI_RUN_ID,
               validatedCiForceFull: true,
               packageJsonVersion: process.env.VERSION,
               manifestVersion: process.env.MANIFEST_VERSION,
              targets: {
                cws: {
                  zip: `streampulse-extension-cws-${process.env.VERSION}.zip`,
                   sha256: process.env.CWS_DIGEST,
                   validationReport: `streampulse-extension-cws-${process.env.VERSION}.validation.json`,
                   attestationRef: null,
                   attestationSourceRef: null,
                   attestationSourceDigest: null,
                   attestationVerified: false
                 },
                edge: {
                  zip: `streampulse-extension-edge-${process.env.VERSION}.zip`,
                   sha256: process.env.EDGE_DIGEST,
                   validationReport: `streampulse-extension-edge-${process.env.VERSION}.validation.json`,
                   attestationRef: null,
                   attestationSourceRef: null,
                   attestationSourceDigest: null,
                   attestationVerified: false
                 },
                firefox: {
                  zip: `streampulse-extension-firefox-${process.env.VERSION}.zip`,
                   sha256: process.env.FIREFOX_DIGEST,
                   validationReport: `streampulse-extension-firefox-${process.env.VERSION}.validation.json`,
                   attestationRef: null,
                   attestationSourceRef: null,
                   attestationSourceDigest: null,
                   attestationVerified: false
                 }
              },
              notes: [
                "Checksum files are operator convenience digests, not cryptographic provenance.",
                "Cryptographic provenance is the GitHub artifact attestation created in this workflow.",
                "Do not replace draft release ZIP assets until the owner explicitly approves."
              ]
            };
            fs.writeFileSync(
              "release-verification/release-artifact-verification.json",
              JSON.stringify(report, null, 2) + "\n"
            );
            fs.writeFileSync(
               "release-verification/RELEASE_BUILD_METADATA.txt",
               [
                 `tag=${process.env.TAG}`,
                 `source_sha=${process.env.SOURCE_SHA}`,
                 `workflow_run_id=${process.env.RUN_ID}`,
                 `validated_ci_run_id=${process.env.CI_RUN_ID}`,
                 "validated_ci_force_full=true",
                 `package_json_version=${process.env.VERSION}`,
                `manifest_version=${process.env.MANIFEST_VERSION}`,
                `cws_zip_sha256=${process.env.CWS_DIGEST}`,
                `edge_zip_sha256=${process.env.EDGE_DIGEST}`,
                `firefox_zip_sha256=${process.env.FIREFOX_DIGEST}`,
                "",
                "This file is unsigned build metadata for operators.",
                "It is NOT cryptographic provenance. Use GitHub artifact attestations.",
                ""
              ].join("\n")
            );
          '
          echo "cws_digest=${CWS_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "edge_digest=${EDGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "firefox_digest=${FIREFOX_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "CWS ${CWS_DIGEST}"
          echo "EDGE ${EDGE_DIGEST}"
          echo "FIREFOX ${FIREFOX_DIGEST}"

      # actions/attest-build-provenance@v4.1.1
      - name: Attest CWS ZIP
        id: attest_cws
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: streampulse-extension-cws-${{ steps.digests.outputs.version }}.zip

      # actions/attest-build-provenance@v4.1.1
      - name: Attest Edge ZIP
        id: attest_edge
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: streampulse-extension-edge-${{ steps.digests.outputs.version }}.zip

      # actions/attest-build-provenance@v4.1.1
      - name: Attest Firefox ZIP
        id: attest_firefox
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: streampulse-extension-firefox-${{ steps.digests.outputs.version }}.zip

      - name: Verify ZIP attestations bind to exact tag source
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          TAG: ${{ steps.verify.outputs.tag }}
          VERSION: ${{ steps.digests.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE_REF="refs/tags/${TAG}"
          mkdir -p release-verification
          for target in cws edge firefox; do
            ZIP="streampulse-extension-${target}-${VERSION}.zip"
            EVIDENCE="release-verification/${target}-attestation-verification.json"
            gh attestation verify "${ZIP}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-artifacts.yml" \
              --source-ref "${SOURCE_REF}" \
              --source-digest "${SOURCE_SHA}" \
              --predicate-type "https://slsa.dev/provenance/v1" \
              --format json > "${EVIDENCE}"
            node scripts/verify-release-attestation.mjs "${EVIDENCE}" "${SOURCE_REF}" "${SOURCE_SHA}" "${ZIP}"
          done

      - name: Embed attestation references in report
        env:
          CWS_ATTEST: ${{ steps.attest_cws.outputs.attestation-url }}
          EDGE_ATTEST: ${{ steps.attest_edge.outputs.attestation-url }}
          FIREFOX_ATTEST: ${{ steps.attest_firefox.outputs.attestation-url }}
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
          SOURCE_REF: refs/tags/${{ steps.verify.outputs.tag }}
          VERSION: ${{ steps.digests.outputs.version }}
        run: |
          set -euo pipefail
          [[ -n "${CWS_ATTEST}" ]] || { echo "::error::CWS attestation URL is empty"; exit 1; }
          [[ -n "${EDGE_ATTEST}" ]] || { echo "::error::Edge attestation URL is empty"; exit 1; }
          [[ -n "${FIREFOX_ATTEST}" ]] || { echo "::error::Firefox attestation URL is empty"; exit 1; }
          node -e '
            const fs = require("fs");
            const path = "release-verification/release-artifact-verification.json";
            const report = JSON.parse(fs.readFileSync(path, "utf8"));
            const attestations = {
              cws: process.env.CWS_ATTEST,
              edge: process.env.EDGE_ATTEST,
              firefox: process.env.FIREFOX_ATTEST,
            };
            for (const [target, ref] of Object.entries(attestations)) {
              if (!ref) throw new Error(`${target} attestation URL is empty`);
              report.targets[target].attestationRef = ref;
              report.targets[target].attestationSourceRef = process.env.SOURCE_REF;
              report.targets[target].attestationSourceDigest = process.env.SOURCE_SHA;
              report.targets[target].attestationVerified = true;
            }
            fs.writeFileSync(path, JSON.stringify(report, null, 2) + "\n");
            fs.appendFileSync(
              "release-verification/RELEASE_BUILD_METADATA.txt",
              [
                `source_ref=${process.env.SOURCE_REF}`,
                `source_sha=${process.env.SOURCE_SHA}`,
                `cws_attestation_ref=${process.env.CWS_ATTEST}`,
                `cws_attestation_source_ref=${process.env.SOURCE_REF}`,
                `cws_attestation_source_digest=${process.env.SOURCE_SHA}`,
                `edge_attestation_ref=${process.env.EDGE_ATTEST}`,
                `edge_attestation_source_ref=${process.env.SOURCE_REF}`,
                `edge_attestation_source_digest=${process.env.SOURCE_SHA}`,
                `firefox_attestation_ref=${process.env.FIREFOX_ATTEST}`,
                `firefox_attestation_source_ref=${process.env.SOURCE_REF}`,
                `firefox_attestation_source_digest=${process.env.SOURCE_SHA}`,
                "attestation_verification=gh attestation verify with --source-ref and --source-digest",
                ""
              ].join("\n")
            );
          '

      # actions/upload-artifact@v4 — retain long enough for store review
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: streampulse-release-${{ steps.verify.outputs.tag }}
          path: |
            streampulse-extension-cws-${{ steps.digests.outputs.version }}.zip
            streampulse-extension-cws-${{ steps.digests.outputs.version }}.zip.sha256
            streampulse-extension-cws-${{ steps.digests.outputs.version }}.validation.json
            streampulse-extension-edge-${{ steps.digests.outputs.version }}.zip
            streampulse-extension-edge-${{ steps.digests.outputs.version }}.zip.sha256
            streampulse-extension-edge-${{ steps.digests.outputs.version }}.validation.json
            streampulse-extension-firefox-${{ steps.digests.outputs.version }}.zip
            streampulse-extension-firefox-${{ steps.digests.outputs.version }}.zip.sha256
            streampulse-extension-firefox-${{ steps.digests.outputs.version }}.validation.json
            release-verification/
            LICENSE
            NOTICE
          retention-days: 90
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extension-unit:
    name: extension-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aron-Chu/streamclone
          ref: master
          path: _streamclone
          sparse-checkout: |
            packages/pulse-core
            packages/analytics-console
            packages/pulse-charts
          sparse-checkout-cone-mode: false
      - name: Link pulse-core from Streamclone
        run: bash scripts/ci-link-pulse-core.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  portal:
    name: portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streampulse-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Aron-Chu/streamclone
          ref: master
          path: _streamclone
          sparse-checkout: |
            packages/pulse-core
            packages/analytics-console
            packages/pulse-charts
          sparse-checkout-cone-mode: false
      - name: Link Streamclone packages
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-link-streamclone-packages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: streampulse-web/package-lock.json
      - run: npm ci
      - run: npm test -- --pool=forks --maxWorkers=4
      - run: npx vite build
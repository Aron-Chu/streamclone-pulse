name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  extension-unit:
    name: extension-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pulse packages
        env:
          STREAMPULSE_BACKEND_CHECKOUT_TOKEN: ${{ secrets.STREAMPULSE_BACKEND_CHECKOUT_TOKEN }}
        run: bash scripts/ci-checkout-pulse-packages.sh
      - name: Link pulse packages from streampulse-backend
        run: bash scripts/ci-link-streamclone-packages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  portal:
    name: portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streampulse-web
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pulse packages
        working-directory: ${{ github.workspace }}
        env:
          STREAMPULSE_BACKEND_CHECKOUT_TOKEN: ${{ secrets.STREAMPULSE_BACKEND_CHECKOUT_TOKEN }}
        run: bash scripts/ci-checkout-pulse-packages.sh
      - name: Link StreamPulse packages
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci-link-streamclone-packages.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: streampulse-web/package-lock.json
      - run: npm ci
      - run: npm test -- --pool=forks --maxWorkers=2 --no-file-parallelism
      - run: npx vite build
